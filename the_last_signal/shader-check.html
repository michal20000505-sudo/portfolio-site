<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>shader check</title></head>
<body>
<pre id="out">compiling…</pre>
<script type="module">
  import { signalCoreFrag } from './src/gl/shaders/signalCore.js';
  import { sourceFrag } from './src/gl/shaders/source.js';
  import { streamVert, streamFrag, streamFieldFrag } from './src/gl/shaders/stream.js';
  import { filmFrag } from './src/gl/shaders/film.js';
  import { FULLSCREEN_VERT } from './src/gl/renderer.js';

  const gl = document.createElement('canvas').getContext('webgl2');
  const out = [];

  function check(name, type, src) {
    const sh = gl.createShader(type);
    gl.shaderSource(sh, src);
    gl.compileShader(sh);
    if (gl.getShaderParameter(sh, gl.COMPILE_STATUS)) {
      out.push(`OK   ${name}`);
    } else {
      const log = gl.getShaderInfoLog(sh).trim();
      const lines = src.split('\n');
      const nums = [...log.matchAll(/ERROR:\s*\d+:(\d+)/g)].map((m) => Number(m[1]));
      const ctx = [...new Set(nums)].map((n) =>
        lines.slice(Math.max(0, n - 3), n + 2)
          .map((l, i) => `${String(Math.max(1, n - 2) + i).padStart(4)}| ${l}`).join('\n')
      ).join('\n      ...\n');
      out.push(`FAIL ${name}\n${log}\n${ctx}`);
    }
    gl.deleteShader(sh);
  }

  if (!gl) {
    out.push('no webgl2 context');
  } else {
    check('signalCore.frag', gl.FRAGMENT_SHADER, signalCoreFrag);
    check('source.frag', gl.FRAGMENT_SHADER, sourceFrag);
    check('streamField.frag', gl.FRAGMENT_SHADER, streamFieldFrag);
    check('stream.vert', gl.VERTEX_SHADER, streamVert);
    check('stream.frag', gl.FRAGMENT_SHADER, streamFrag);
    check('film.frag', gl.FRAGMENT_SHADER, filmFrag);
    check('fullscreen.vert', gl.VERTEX_SHADER, FULLSCREEN_VERT);
  }

  window.__RESULT = out.join('\n\n');
  document.getElementById('out').textContent = window.__RESULT;
</script>
</body>
</html>
