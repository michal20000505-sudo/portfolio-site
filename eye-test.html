<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<title>eye test</title>
<style>
    body { background: #050505; margin: 0; height: 100vh; display: grid; place-items: center; }
    #mech-eye { width: 640px; aspect-ratio: 1; opacity: 0; transition: opacity .3s; }
    #mech-eye.ready { opacity: 1; }
    #mech-eye canvas { width: 100%; height: 100%; display: block; }
</style>
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }</script>
</head>
<body>
<div id="mech-eye" data-noflight="1"></div>
<script>
    const q = new URLSearchParams(location.search);
    const v = q.get('variant');
    if (v) document.getElementById('mech-eye').dataset.variant = v;
    if (q.get('visor')) document.getElementById('mech-eye').dataset.visoropen = '1';
</script>
<script type="module" src="eye.js"></script>
</body>
</html>
