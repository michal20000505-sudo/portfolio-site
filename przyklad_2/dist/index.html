    <svg
      aria-hidden='true'
      focusable='false'
      width='0'
      height='0'
      style='position: fixed; width: 0; height: 0; overflow: hidden; pointer-events: none'
    >
      <defs>
        <filter
          id='feedback-glass-baseline'
          x='-25%'
          y='-25%'
          width='150%'
          height='150%'
          color-interpolation-filters='sRGB'
        >
          <feTurbulence
            type='fractalNoise'
            baseFrequency='0.007 0.026'
            numOctaves='2'
            seed='17'
            result='noise'
          />
          <feGaussianBlur in='noise' stdDeviation='1.2' result='soft-noise' />
          <feDisplacementMap
            in='SourceGraphic'
            in2='soft-noise'
            scale='105'
            xChannelSelector='R'
            yChannelSelector='G'
            result='refracted'
          />
        </filter>
      </defs>
    </svg>
